<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDILSA | Comentarios</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif
}

body{
background:#f4f6fb;
color:#111;
}

/* HERO */

.hero{
height:260px;
background:
linear-gradient(rgba(0,0,0,0.25),rgba(0,0,0,0.45)),
url("https://i.ibb.co/HDMyyLZs/trabajadores.jpg");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero img{
width:110px;
border-radius:14px;
margin-bottom:10px;
box-shadow:0 15px 40px rgba(0,0,0,0.45);
}

.hero h1{
font-size:2.2rem;
color:white;
font-weight:800;
}

.hero span{
color:#4aa3ff;
}

/* CONTENEDOR */

.container{
max-width:900px;
margin:40px auto;
padding:0 16px;
}

/* CARD */

.card{
background:white;
border-radius:22px;
padding:30px;
box-shadow:0 25px 60px rgba(0,0,0,.15);
}

/* FORM */

.form-title{
font-size:1.3rem;
font-weight:700;
margin-bottom:20px;
}

.comment-form{
display:flex;
flex-direction:column;
gap:12px;
margin-bottom:35px;
}

.comment-form input,
.comment-form textarea{
padding:14px;
border-radius:12px;
border:1px solid #ddd;
font-size:14px;
}

.comment-form input:focus,
.comment-form textarea:focus{
outline:none;
border-color:#003B8E;
box-shadow:0 0 0 3px rgba(0,59,142,.2);
}

.comment-form button{
background:#003B8E;
color:white;
border:none;
padding:13px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

/* COMMENTS */

.comments{
display:flex;
flex-direction:column;
gap:18px;
}

.comment{
background:#fff;
padding:18px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.username{
font-weight:700;
margin-bottom:6px;
}

.comment p{
font-size:14px;
line-height:1.6;
color:#444;
}

/* REPLY */

.reply{
margin-top:10px;
padding:10px;
background:#f5f8ff;
border-left:4px solid #003B8E;
display:flex;
gap:10px;
}

.reply img{
width:36px;
height:36px;
border-radius:50%;
}

/* REACCIONES */

.reactions{
margin-top:10px;
display:flex;
gap:16px;
}

.reactions button{
background:none;
border:none;
cursor:pointer;
font-size:14px;
}

</style>
</head>

<body>

<section class="hero">
<div>
<img src="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg">
<h1>Comentarios de <span>IDILSA</span></h1>
</div>
</section>

<section class="container">

<div class="card">

<div class="form-title">Deja tu comentario</div>

<div class="comment-form">
<input id="username" placeholder="Nombre o empresa">
<textarea id="comment" rows="4" placeholder="Escribe tu comentario..."></textarea>
<button onclick="postComment()">Enviar</button>
</div>

<div class="comments" id="comments-container"></div>

</div>

</section>

<script>

const COMPANY_LOGO="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg"

const apiKey='$2a$10$I6PZpdf7tigg4VzFm.HK4.0prPJwN4BpoCJiiLFEAzstr9juBlx.K'
const binId='6938e950d0ea881f401e8e90'

async function loadComments(){

const r=await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`,{
headers:{'X-Master-Key':apiKey}
})

const d=await r.json()

/* detecta diferentes estructuras */

if(d.record.comments){
window.comments=d.record.comments
}
else if(Array.isArray(d.record)){
window.comments=d.record
}
else{
window.comments=[]
}

renderComments()

}

function renderComments(){

const c=document.getElementById('comments-container')

c.innerHTML=window.comments.map((x,i)=>`

<div class="comment">

<div class="username">${x.username || "Usuario"}</div>

<p>${x.text || x.comment || ""}</p>

<div class="reactions">

<button onclick="like(${i})">👍 ${x.likes||0}</button>

<button onclick="dislike(${i})">👎 ${x.dislikes||0}</button>

</div>

</div>

`).join('')

}

async function save(){

await fetch(`https://api.jsonbin.io/v3/b/${binId}`,{

method:'PUT',

headers:{
'Content-Type':'application/json',
'X-Master-Key':apiKey
},

body:JSON.stringify({comments:window.comments})

})

}

async function postComment(){

const u=username.value.trim()
const t=comment.value.trim()

if(!u||!t){
alert('Completa los campos')
return
}

window.comments.unshift({

username:u,
text:t,
likes:0,
dislikes:0

})

username.value=''
comment.value=''

renderComments()

await save()

}

function like(i){
window.comments[i].likes=(window.comments[i].likes||0)+1
renderComments()
save()
}

function dislike(i){
window.comments[i].dislikes=(window.comments[i].dislikes||0)+1
renderComments()
save()
}

window.onload=loadComments

</script>

</body>
</html>
