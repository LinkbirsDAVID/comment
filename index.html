<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>IDILSA | Comentarios</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f4f6fb;color:#111;overflow-x:hidden}

/* ===== HERO ===== */
.hero{
  position:relative;
  height:40vh;
  min-height:300px;
  display:flex;
  justify-content:center;
  align-items:center;

  /* IMAGEN DETRAS DEL LOGO */
  background:
  linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0.8)),
  url("https://i.ibb.co/HDMyyLZs/trabajadores.jpg");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  overflow:hidden;
}

.hero-content{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:18px;
}

/* ===== LOGO ===== */
.hero-content img{
  width:25vw;
  max-width:160px;
  min-width:90px;
  border-radius:15px;
  box-shadow:0 15px 40px rgba(0,0,0,0.35),0 0 30px rgba(0,31,84,0.2);
  transition: transform .5s ease, filter .5s ease, box-shadow .5s ease;
  cursor:pointer;
  animation:logoIntro 1s ease-out;
}

.hero-content img:hover{
  transform:scale(1.1) rotate(-2deg);
  filter:brightness(1.2);
  box-shadow:0 20px 50px rgba(0,0,0,0.5),0 0 40px rgba(0,31,84,0.3);
}

/* ANIMACIÓN */
@keyframes logoIntro{
  0%{opacity:0; transform: translateY(-50px) scale(0.7);}
  60%{opacity:1; transform: translateY(15px) scale(1.05);}
  100%{opacity:1; transform: translateY(0) scale(1);}
}

/* TITULO */
.hero-content h1{
  font-size:2.8rem;
  font-weight:900;
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,0.7);
}

.hero-content span{
  background:linear-gradient(90deg,#001F54,#003B8E);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:-80px auto 0;
  padding:0 16px 90px;
  position:relative;
  z-index:10;
}

/* CARD */
.card{
  background:#fff;
  border-radius:26px;
  padding:30px 24px;
  box-shadow:0 35px 70px rgba(0,0,0,.15);
}

/* FORM */
.form-title{
  font-size:1.3rem;
  font-weight:700;
  margin-bottom:18px;
}

.comment-form{
  display:grid;
  gap:14px;
  margin-bottom:36px;
}

.comment-form input,
.comment-form textarea{
  background:#f9fafc;
  border:1px solid #ddd;
  padding:13px 15px;
  border-radius:12px;
  font-size:14px;
}

.comment-form input:focus,
.comment-form textarea:focus{
  outline:none;
  border-color:#001F54;
  box-shadow:0 0 0 3px rgba(0,31,84,.25);
}

.comment-form button{
  padding:12px 28px;
  background:#001F54;
  color:#fff;
  font-weight:800;
  border:none;
  border-radius:12px;
  cursor:pointer;
}

/* COMMENTS */
.comments{
  display:grid;
  gap:20px;
}

.comment{
  background:#fff;
  border-radius:18px;
  padding:18px 20px;
  box-shadow:0 10px 28px rgba(0,0,0,.1);
}

.username{
  font-weight:700;
  margin-bottom:4px;
}

.comment p{
  font-size:14px;
  line-height:1.6;
  color:#444;
}

@media(max-width:520px){
  .hero-content h1{font-size:2rem}
  .card{padding:24px 18px}
  .comment-form button{width:100%}
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-content">
    <img src="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg" alt="Logo IDILSA">
    <h1>Comentarios de <span>IDILSA</span></h1>
  </div>
</section>

</body>
</html>
