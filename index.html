<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDILSA | Comentarios</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif
}

body{
background:#f4f6fb;
color:#111;
}

/* HERO */

.hero{

height:260px;

background:
linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.55)),
url("https://i.ibb.co/HDMyyLZs/trabajadores.jpg");

background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;

}

.hero-content{
color:white;
}

.hero img{

width:110px;
border-radius:14px;
margin-bottom:10px;
box-shadow:0 15px 40px rgba(0,0,0,0.45);

}

.hero h1{
font-size:2.2rem;

text-shadow:0 3px 15px rgba(0,0,0,0.6);
}

.hero span{

}

.container{

.card{

}

.comment-form textarea{

}

.comment-form textarea:focus{

outline:none;
border-color:#003B8E;
box-shadow:0 0 0 3px rgba(0,59,142,.2);

}

.comment-form button{

background:#003B8E;
color:white;
border:none;
padding:13px;

}

.comment-form button:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.comments{
display:flex;

</head>

<body>

<section class="hero">

<div class="hero-content">

<img src="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg">

<h1>Comentarios de <span>IDILSA</span></h1>

</div>

</section>

<section class="container">

<div class="card">

<div class="form-title">Deja tu comentario</div>

<div class="comment-form">

<input id="username" placeholder="Nombre o empresa">

<textarea id="comment" rows="4" placeholder="Escribe tu comentario..."></textarea>

<button onclick="postComment()">Enviar</button>

</div>

<div class="comments" id="comments-container"></div>

</div>

</section>

<script>

const COMPANY_LOGO="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg"

/* NUEVO BIN */
const apiKey='$2a$10$I6PZpdf7tigg4VzFm.HK4.0prPJwN4BpoCJiiLFEAzstr9juBlx.K'
const binId='6938e950d0ea881f401e8e90'

async function loadComments(){

const r=await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`,{
headers:{'X-Master-Key':apiKey}
})

const d=await r.json()

window.comments=d.record.comments||[]

renderComments()

}

function renderComments(){

const c=document.getElementById('comments-container')

c.innerHTML=window.comments.map((x,i)=>`

<div class="comment">

<div class="username">${x.username}</div>

<p>${x.text}</p>

${x.reply?`

<div class="reply">

<img src="${x.reply.logo||COMPANY_LOGO}">

<div>

<strong>IDILSA – Empresa</strong>

<p>${x.reply.text}</p>

<div class="reactions">

<button onclick="likeReply(${i})">😁 ${x.reply.likes||0}</button>

<button onclick="dislikeReply(${i})">🫤 ${x.reply.dislikes||0}</button>

</div>

</div>

</div>

`:''}

<div class="reactions">

<button onclick="like(${i})">👍 ${x.likes||0}</button>

<button onclick="dislike(${i})">👎 ${x.dislikes||0}</button>

</div>

</div>

`).join('')

}

async function save(){

await fetch(`https://api.jsonbin.io/v3/b/${binId}`,{

method:'PUT',

headers:{
'Content-Type':'application/json',
'X-Master-Key':apiKey
},

body:JSON.stringify({comments:window.comments})

})

}

async function postComment(){

const u=username.value.trim()
const t=comment.value.trim()

if(!u||!t){
alert('Completa los campos')
return
}

window.comments.unshift({

username:u,
text:t,
likes:0,
dislikes:0

})

username.value=''
comment.value=''

renderComments()

await save()

}

function like(i){
window.comments[i].likes++
renderComments()
save()
}

function dislike(i){
window.comments[i].dislikes++
renderComments()
save()
}

function likeReply(i){
window.comments[i].reply.likes=(window.comments[i].reply.likes||0)+1
renderComments()
save()
}

function dislikeReply(i){
window.comments[i].reply.dislikes=(window.comments[i].reply.dislikes||0)+1
renderComments()
save()
}

window.onload=loadComments

</script>

</body>
</html>
