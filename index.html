<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDILSA | Comentarios</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
background:#f4f6fb;
color:#111;
overflow-x:hidden;
}

/* HERO */
.hero{
position:relative;
height:42vh;
min-height:320px;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.55)),
url("https://i.ibb.co/HDMyyLZs/trabajadores.jpg");

background-size:cover;
background-position:center;
}

/* CONTENIDO HERO */

.hero-content{
position:relative;
z-index:2;
text-align:center;
display:flex;
flex-direction:column;
align-items:center;
gap:16px;
}

/* LOGO */

.hero-content img{
width:130px;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
animation:logoIntro 1s ease;
}

@keyframes logoIntro{
from{opacity:0;transform:translateY(-40px) scale(.8)}
to{opacity:1;transform:translateY(0) scale(1)}
}

/* TITULO */

.hero-content h1{
font-size:2.8rem;
font-weight:900;
color:white;
text-shadow:0 5px 25px rgba(0,0,0,0.7);
}

.hero-content span{
color:#4aa3ff;
text-shadow:0 0 10px rgba(0,70,255,.6);
}

/* CONTENEDOR */

.container{
max-width:900px;
margin:-70px auto 0;
padding:0 16px 90px;
}

/* CARD */

.card{
background:white;
border-radius:25px;
padding:30px 25px;
box-shadow:0 30px 70px rgba(0,0,0,.15);
}

/* FORM */

.form-title{
font-size:1.3rem;
font-weight:700;
margin-bottom:18px;
}

.comment-form{
display:grid;
gap:14px;
margin-bottom:30px;
}

.comment-form input,
.comment-form textarea{
padding:13px;
border-radius:12px;
border:1px solid #ddd;
font-size:14px;
}

.comment-form input:focus,
.comment-form textarea:focus{
outline:none;
border-color:#003B8E;
box-shadow:0 0 0 3px rgba(0,59,142,.2);
}

.comment-form button{
padding:12px 28px;
background:#003B8E;
color:white;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.comment-form button:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

/* COMMENTS */

.comments{
display:grid;
gap:20px;
}

.comment{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 10px 28px rgba(0,0,0,.1);
animation:fadeUp .5s ease;
}

.username{
font-weight:700;
margin-bottom:4px;
}

.comment p{
font-size:14px;
line-height:1.6;
color:#444;
}

/* RESPUESTA EMPRESA */

.reply{
margin-top:10px;
background:#f5f8ff;
border-left:4px solid #003B8E;
padding:10px;
display:flex;
gap:10px;
}

.reply img{
width:40px;
border-radius:50%;
}

.reply-content{
flex:1;
}

/* REACCIONES */

.reactions{
display:flex;
gap:20px;
margin-top:10px;
}

.reactions button{
background:none;
border:none;
cursor:pointer;
font-size:1rem;
color:#555;
}

.reactions button:hover{
transform:scale(1.1);
}

/* ANIMACION */

@keyframes fadeUp{
from{opacity:0;transform:translateY(15px)}
to{opacity:1;transform:none}
}

@media(max-width:520px){
.hero-content h1{font-size:2rem}
.comment-form button{width:100%}
}
</style>
</head>

<body>

<!-- HERO -->

<section class="hero">
<div class="hero-content">
<img src="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg">
<h1>Comentarios de <span>IDILSA</span></h1>
</div>
</section>

<!-- CONTENIDO -->

<section class="container">

<div class="card">

<div class="form-title">Deja tu comentario</div>

<div class="comment-form">
<input id="username" placeholder="Nombre o empresa">
<textarea id="comment" rows="4" placeholder="Escribe tu comentario..."></textarea>
<button onclick="postComment()">Enviar</button>
</div>

<div class="comments" id="comments-container"></div>

</div>

</section>

<script>

const COMPANY_LOGO="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg"

const apiKey='$2a$10$H8fYDMYAfW91NOGssZhtfu7eCA.O5tW7q/l6J73Ag75d7eB9Pcd8q'
const binId='693b27d5ae596e708f9358c1'

async function loadComments(){

const r=await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`,{
headers:{'X-Master-Key':apiKey}
})

const d=await r.json()

window.comments=d.record.comments||[]

renderComments()

}

function renderComments(){

const c=document.getElementById('comments-container')

c.innerHTML=window.comments.map((x,i)=>`

<div class="comment">

<div class="username">${x.username}</div>

<p>${x.text}</p>

${x.reply?`

<div class="reply">

<img src="${x.reply.logo||COMPANY_LOGO}">

<div class="reply-content">

<strong>IDILSA – Empresa</strong>

<p>${x.reply.text}</p>

<div class="reactions">

<button onclick="likeReply(${i})">😁 ${x.reply.likes||0}</button>

<button onclick="dislikeReply(${i})">🫤 ${x.reply.dislikes||0}</button>

</div>

</div>

</div>

`:''}

<div class="reactions">

<button onclick="like(${i})">👍 ${x.likes||0}</button>

<button onclick="dislike(${i})">👎 ${x.dislikes||0}</button>

</div>

</div>

`).join('')

}

async function save(){

await fetch(`https://api.jsonbin.io/v3/b/${binId}`,{

method:'PUT',

headers:{
'Content-Type':'application/json',
'X-Master-Key':apiKey
},

body:JSON.stringify({comments:window.comments})

})

}

async function postComment(){

const u=username.value.trim()

const t=comment.value.trim()

if(!u||!t){
alert('Completa los campos')
return
}

window.comments.unshift({

username:u,
text:t,
likes:0,
dislikes:0

})

username.value=''
comment.value=''

renderComments()

await save()

}

function like(i){

window.comments[i].likes++

renderComments()

save()

}

function dislike(i){

window.comments[i].dislikes++

renderComments()

save()

}

function likeReply(i){

window.comments[i].reply.likes=(window.comments[i].reply.likes||0)+1

renderComments()

save()

}

function dislikeReply(i){

window.comments[i].reply.dislikes=(window.comments[i].reply.dislikes||0)+1

renderComments()

save()

}

window.onload=loadComments

</script>

</body>
</html>
