<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>IDILSA | Comentarios</title>

<link href="img src="https://i.ibb.co/HDMyyLZs/trabajadores.jpg" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f4f6fb;color:#111;overflow-x:hidden}

/* ===== HERO ===== */
.hero{
  position:relative;
  height:40vh;
  min-height:300px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0.8)),
             url('img src="https://i.ibb.co/HDMyyLZs/trabajadores.jpg') center/cover no-repeat;
  overflow:hidden;
}

.hero-content{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:18px;
}

/* ===== LOGO ===== */
.hero-content img{
  width:25vw;
  max-width:160px;
  min-width:90px;
  border-radius:15px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.35), 0 0 30px rgba(0,31,84,0.2);
  transition: transform 0.5s ease, filter 0.5s ease, box-shadow 0.5s ease;
  cursor:pointer;
  animation:logoIntro 1s ease-out;
}
.hero-content img:hover{
  transform: scale(1.1) rotate(-2deg);
  filter:brightness(1.2);
  box-shadow:0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(0,31,84,0.3);
}

/* ===== ANIMACIÓN LOGO ===== */
@keyframes logoIntro{
  0%{opacity:0; transform: translateY(-50px) scale(0.7);}
  60%{opacity:1; transform: translateY(15px) scale(1.05);}
  100%{opacity:1; transform: translateY(0) scale(1);}
}

/* ===== TITULO HERO ===== */
.hero-content h1{
  font-size:2.8rem;
  font-weight:900;
  line-height:1.2;
  color:#fff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}
.hero-content span{
  background: linear-gradient(90deg,#001F54,#003B8E);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ===== CONTAINER ===== */
.container{
  max-width:900px;
  margin:-80px auto 0;
  padding:0 16px 90px;
  position:relative;
  z-index:10;
}

/* ===== CARD ===== */
.card{
  background:#fff;
  border-radius:26px;
  padding:30px 24px;
  box-shadow:0 35px 70px rgba(0,0,0,.15);
  word-wrap:break-word;
}

/* ===== FORM ===== */
.form-title{
  font-size:1.3rem;
  font-weight:700;
  margin-bottom:18px;
}
.comment-form{
  display:grid;
  gap:14px;
  margin-bottom:36px;
}
.comment-form input,
.comment-form textarea{
  background:#f9fafc;
  border:1px solid #ddd;
  padding:13px 15px;
  border-radius:12px;
  font-size:14px;
}
.comment-form input:focus,
.comment-form textarea:focus{
  outline:none;
  border-color:#001F54;
  box-shadow:0 0 0 3px rgba(0,31,84,.25);
}
.comment-form button{
  align-self:flex-start;
  padding:12px 28px;
  background:#001F54;
  color:#fff;
  font-weight:800;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:.25s;
}
.comment-form button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}

/* ===== COMMENTS ===== */
.comments{
  display:grid;
  gap:20px;
}
.comment{
  background:#fff;
  border-radius:18px;
  padding:18px 20px;
  box-shadow:0 10px 28px rgba(0,0,0,.1);
  animation:fadeUp .6s ease both;
  word-wrap:break-word;
}
.username{
  font-weight:700;
  margin-bottom:4px;
}
.comment p{
  font-size:14px;
  line-height:1.6;
  color:#444;
}

/* RESPUESTA EMPRESA */
.comment .reply{
  margin-top:10px;
  background:#f9fafc;
  border-left:4px solid #001F54;
  padding:10px;
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.comment .reply img{
  width:40px;
  border-radius:50%;
}
.comment .reply-content{
  flex:1;
}

/* ===== REACTIONS ===== */
.reactions{
  display:flex;
  gap:20px;
  margin-top:10px;
  flex-wrap:wrap;
}
.reactions button{
  background:none;
  border:none;
  color:#666;
  font-size:1.05rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:.25s;
}
.reactions button.active{
  color:#001F54;
  animation:bounce .35s;
}
.reactions button:hover{
  transform:scale(1.15);
}

/* ===== ANIM ===== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
@keyframes bounce{
  0%{transform:scale(1)}
  40%{transform:scale(1.35)}
  100%{transform:scale(1)}
}

@media(max-width:520px){
  .hero-content h1{font-size:2rem}
  .card{padding:24px 18px}
  .comment-form button{width:100%}
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-content">
    <img src="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg" alt="Logo IDILSA">
    <h1>Comentarios de <span>IDILSA</span></h1>
  </div>
</section>

<!-- CONTENIDO -->
<section class="container">
  <div class="card">
    <div class="form-title">Deja tu comentario</div>
    <div class="comment-form">
      <input id="username" placeholder="Nombre o empresa">
      <textarea id="comment" rows="4" placeholder="Escribe tu comentario..."></textarea>
      <button onclick="postComment()">Enviar</button>
    </div>
    <div class="comments" id="comments-container"></div>
  </div>
</section>

<script>
const COMPANY_LOGO = "WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg";
const apiKey='$2a$10$H8fYDMYAfW91NOGssZhtfu7eCA.O5tW7q/l6J73Ag75d7eB9Pcd8q';
const binId='693b27d5ae596e708f9358c1';

async function loadComments(){
 const r = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`,{
   headers:{'X-Master-Key':apiKey}
 });
 const d = await r.json();
 window.comments = d.record.comments || [];
 renderComments();
}

function renderComments(){
 const c = document.getElementById('comments-container');
 c.innerHTML = window.comments.map((x,i)=>`
  <div class="comment">
    <div class="username">${x.username}</div>
    <p>${x.text}</p>

    ${x.reply ? `
    <div class="reply">
      <img src="${x.reply.logo||COMPANY_LOGO}">
      <div class="reply-content">
        <strong>IDILSA – Empresa</strong>
        <p>${x.reply.text}</p>
        <div class="reactions">
          <button onclick="likeReply(${i},this)">😁 ${x.reply.likes||0}</button>
          <button onclick="dislikeReply(${i},this)">🫤 ${x.reply.dislikes||0}</button>
        </div>
      </div>
    </div>` : ''}

    <div class="reactions">
      <button onclick="like(${i},this)">👍 ${x.likes}</button>
      <button onclick="dislike(${i},this)">👎 ${x.dislikes}</button>
    </div>
  </div>
 `).join('');
}

async function save(){
 await fetch(`https://api.jsonbin.io/v3/b/${binId}`,{
  method:'PUT',
  headers:{
    'Content-Type':'application/json',
    'X-Master-Key':apiKey
  },
  body:JSON.stringify({comments:window.comments})
 });
}

async function postComment(){
 const u=username.value.trim();
 const t=comment.value.trim();
 if(!u||!t){alert('Completa los campos');return;}
 window.comments.unshift({username:u,text:t,likes:0,dislikes:0});
 username.value='';
 comment.value='';
 renderComments();
 await save();
}

function like(i,btn){
 window.comments[i].likes++;
 renderComments();
 save();
}

function dislike(i,btn){
 window.comments[i].dislikes++;
 renderComments();
 save();
}

function likeReply(i,btn){
 window.comments[i].reply.likes = (window.comments[i].reply.likes||0)+1;
 renderComments();
 save();
}

function dislikeReply(i,btn){
 window.comments[i].reply.dislikes = (window.comments[i].reply.dislikes||0)+1;
 renderComments();
 save();
}

window.onload = loadComments;
</script>

</body>
</html>
