<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDILSA | Comentarios</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif
}

body{
background:#f4f6fb;
color:#111;
}

/* HERO */

.hero{
height:260px;
background:
linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.55)),
url("https://i.ibb.co/HDMyyLZs/trabajadores.jpg");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero img{
width:110px;
border-radius:14px;
margin-bottom:10px;
box-shadow:0 15px 40px rgba(0,0,0,0.45);
}

.hero h1{
font-size:2.2rem;
color:white;
font-weight:800;
}

.hero span{
color:#4aa3ff;
}

/* CONTENEDOR */

.container{
max-width:900px;
margin:40px auto;
padding:0 16px;
}

/* CARD */

.card{
background:white;
border-radius:22px;
padding:30px;
box-shadow:0 25px 60px rgba(0,0,0,.15);
}

/* FORM */

.form-title{
font-size:1.3rem;
font-weight:700;
margin-bottom:20px;
}

.comment-form{
display:flex;
flex-direction:column;
gap:12px;
margin-bottom:35px;
}

.comment-form input,
.comment-form textarea{
padding:14px;
border-radius:12px;
border:1px solid #ddd;
font-size:14px;
}

.comment-form button{
background:#003B8E;
color:white;
border:none;
padding:13px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

/* COMMENTS */

.comments{
display:flex;
flex-direction:column;
gap:18px;
}

.comment{
background:#fff;
padding:18px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.featured{
border:2px solid #4aa3ff;
}

.featured-label{
background:#4aa3ff;
color:white;
font-size:12px;
padding:4px 8px;
border-radius:6px;
display:inline-block;
margin-bottom:8px;
font-weight:600;
}

.username{
font-weight:700;
margin-bottom:6px;
}

.comment p{
font-size:14px;
line-height:1.6;
color:#444;
}

/* RESPUESTA ADMIN */

.reply{
margin-top:12px;
background:#eef4ff;
padding:12px;
border-radius:10px;
font-size:13px;
border-left:4px solid #003B8E;
display:flex;
gap:10px;
align-items:flex-start;
}

.reply img{
width:32px;
height:32px;
border-radius:8px;
}

.reply-name{
font-weight:700;
color:#003B8E;
margin-bottom:2px;
}

/* REACTIONS */

.reactions{
margin-top:10px;
display:flex;
gap:18px;
}

.reactions button{
border:none;
background:none;
cursor:pointer;
font-size:14px;
}

.reactions button:hover{
transform:scale(1.1);
}

</style>
</head>

<body>

<section class="hero">
<div>
<img src="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg">
<h1>Comentarios de <span>IDILSA</span></h1>
</div>
</section>

<section class="container">

<div class="card">

<div class="form-title">Deja tu comentario</div>

<div class="comment-form">
<input id="username" placeholder="Nombre o empresa">
<textarea id="comment" rows="4" placeholder="Escribe tu comentario..."></textarea>
<button onclick="postComment()">Enviar</button>
</div>

<div class="comments" id="comments"></div>

</div>

</section>

<script>

/* CONFIG JSONBIN */

const BIN_ID="69acf753ae596e708f6b9906"

const MASTER_KEY="$2a$10$b7iTGCHm3sPBn6UyLHiCZ.gSwzF/0y7X/a3mpVuqHE2ewj2sEd9Yi"

const ACCESS_KEY="$2a$10$I6PZpdf7tigg4VzFm.HK4.0prPJwN4BpoCJiiLFEAzstr9juBlx.K"

let comments=[]
let lastCommentTime=0

/* CARGAR */

async function loadComments(){

const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{

headers:{
'X-Master-Key':MASTER_KEY,
'X-Access-Key':ACCESS_KEY
}

})

const data=await res.json()

comments=data.record.comments||[]

/* ordenar destacados */

comments.sort((a,b)=>(b.featured===true)-(a.featured===true))

renderComments()

}

/* MOSTRAR */

function renderComments(){

const container=document.getElementById("comments")

container.innerHTML=comments.map((c,i)=>`

<div class="comment ${c.featured?'featured':''}">

${c.featured?'<div class="featured-label">⭐ Comentario destacado</div>':''}

<div class="username">${c.username}</div>

<p>${c.text}</p>

${c.reply ? `

<div class="reply">

<img src="WhatsApp Image 2026-03-07 at 9.50.29 PM.jpeg">

<div>

<div class="reply-name">IDILSA</div>

<div>${c.reply}</div>

<div class="reactions">

<button onclick="likeReply(${i})">👍 ${c.replyLikes||0}</button>

<button onclick="dislikeReply(${i})">👎 ${c.replyDislikes||0}</button>

</div>

</div>

</div>

`:""}

<div class="reactions">

<button onclick="like(${i})">👍 ${c.likes||0}</button>

<button onclick="dislike(${i})">👎 ${c.dislikes||0}</button>

</div>

</div>

`).join("")

}

/* GUARDAR */

async function saveComments(){

await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{

method:"PUT",

headers:{
'Content-Type':'application/json',
'X-Master-Key':MASTER_KEY,
'X-Access-Key':ACCESS_KEY
},

body:JSON.stringify({comments})

})

}

/* PUBLICAR */

async function postComment(){

const username=document.getElementById("username").value.trim()
const text=document.getElementById("comment").value.trim()

if(!username||!text){
alert("Completa los campos")
return
}

const now=Date.now()

if(now-lastCommentTime<10000){
alert("Espera 10 segundos antes de comentar otra vez")
return
}

if(comments.some(c=>c.text.toLowerCase()===text.toLowerCase())){
alert("Ese comentario ya fue publicado")
return
}

lastCommentTime=now

comments.unshift({

username:username,
text:text,
likes:0,
dislikes:0,
reply:"",
replyLikes:0,
replyDislikes:0,
featured:false

})

document.getElementById("username").value=""
document.getElementById("comment").value=""

renderComments()

await saveComments()

}

/* LIKE COMENTARIO */

function like(i){

comments[i].likes=(comments[i].likes||0)+1

renderComments()

saveComments()

}

/* DISLIKE COMENTARIO */

function dislike(i){

comments[i].dislikes=(comments[i].dislikes||0)+1

renderComments()

saveComments()

}

/* LIKE RESPUESTA */

function likeReply(i){

comments[i].replyLikes=(comments[i].replyLikes||0)+1

renderComments()

saveComments()

}

/* DISLIKE RESPUESTA */

function dislikeReply(i){

comments[i].replyDislikes=(comments[i].replyDislikes||0)+1

renderComments()

saveComments()

}

loadComments()

</script>

</body>
</html>
